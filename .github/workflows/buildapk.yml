name: Build APK

# =============================================================================
#  CI pipeline — Simplified integrated workflow
#
#  Phase 1: Setup (Java 17 + Android SDK + NDK + Python + Gradle)
#  Phase 2: Cross-compile upstream libmobiledevice stack (NDK 25)
#  Phase 3: Build Gradle APK from source-built native dependencies
#  Phase 4: Verify APK integrity
#  Phase 5: Upload ONLY final APK
#
#  💡 Key: upstream sources are built in CI and linked into the APK.
#          No opaque native archive is kept in the repository.
# =============================================================================

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch:
    inputs:
      rebuild_native:
        description: 'Force rebuild native (bỏ cache)'
        default: 'false'

env:
  NDK_VERSION: "25.2.9519653"
  JAVA_VERSION: "17"
  ANDROID_PLATFORM: "34"

jobs:
  # Kiểm thử giao thức (không cần iPhone): usbmuxd_server.c + usb_fd_bridge.c
  # chạy với libusbmuxd 2.0.2 + libimobiledevice 1.3.0 THẬT, nói chuyện với
  # iPhone giả lập (tests/native-host/fake_iphone.py); cộng test luồng Python.
  # Job riêng — không chặn job build APK.
  protocol-tests:
    name: "Protocol tests (usbmux + Python flow)"
    runs-on: ubuntu-22.04
    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@v4

      - name: "📥 Install host build tools"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y autoconf automake libtool libtool-bin pkg-config \
            libssl-dev python3 curl git default-jdk-headless

      - name: "🐍 Python: luồng ký & cài (App ID / extension / UDID)"
        run: python3 tests/python/test_sideload_core.py

      - name: "🏗️  Build libplist/libusbmuxd/libimobiledevice cho host"
        run: HOSTDEPS="$RUNNER_TEMP/hostdeps" SRC="$RUNNER_TEMP/hostsrc" bash tests/native-host/build_host_deps.sh

      - name: "🔌 usbmuxd nội bộ ↔ iPhone giả lập"
        run: HOSTDEPS="$RUNNER_TEMP/hostdeps" bash tests/native-host/run.sh

  build:
    name: "Build APK"
    runs-on: ubuntu-22.04

    steps:
      # ══════════════════════════════════════════════════════════════════════
      # Phase 1: Setup environments
      # ══════════════════════════════════════════════════════════════════════
      
      - name: "📥 Checkout repository"
        uses: actions/checkout@v4

      - name: "☕ Setup Java 17"
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: "🤖 Setup Android SDK"
        uses: android-actions/setup-android@v3
        with:
          # Mặc định action cài "tools platform-tools", nhưng gói "tools" (SDK
          # Tools cũ) đã bị Google gỡ khỏi kho → sdkmanager (cmdline-tools 16.0)
          # báo "Failed to find package 'tools'" và thoát mã 1 (run #151).
          # NDK/platform/build-tools do bước kế tiếp tự cài.
          packages: "platform-tools"

      - name: "📦 Install NDK ${{ env.NDK_VERSION }}"
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install \
            "ndk;$NDK_VERSION" \
            "platforms;android-$ANDROID_PLATFORM" \
            "build-tools;34.0.0"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "✅ NDK installed"

      - name: "🐍 Setup Python 3.11 (required by Chaquopy)"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "🔧 Setup Gradle"
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: "📥 Install host build tools"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            autoconf automake libtool libtool-bin pkg-config \
            make cmake ninja-build curl gettext
          echo "✅ Build tools installed"

      # ══════════════════════════════════════════════════════════════════════
      # Phase 2: Cross-compile native libraries
      # ══════════════════════════════════════════════════════════════════════

      - name: "🔐 Calculate cache key"
        id: cache-key
        run: |
          KEY="imd-ndk25.2-$(sha256sum scripts/build_all.sh | cut -d' ' -f1)"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

      - name: "⚡ Restore source-build cache"
        id: cache-restore
        uses: actions/cache@v4
        with:
          path: .native-deps
          key: ${{ steps.cache-key.outputs.key }}
          restore-keys: imd-ndk25.2-

      - name: "🏗️  Cross-compile libmobiledevice stack"
        if: steps.cache-restore.outputs.cache-hit != 'true' || github.event.inputs.rebuild_native == 'true'
        run: |
          chmod +x scripts/build_all.sh
          TARGET_ABIS="arm64-v8a x86_64" \
            NATIVE_DEPS_BASE="$GITHUB_WORKSPACE/.native-deps" \
            bash scripts/build_all.sh

      - name: "✅ Verify source-built libraries"
        run: |
          echo "=== Verifying source-built libraries ==="
          for abi in arm64-v8a x86_64; do
            if [ ! -d ".native-deps/$abi/lib" ]; then
              echo "❌ Missing .native-deps/$abi/lib"
              exit 1
            fi
            count=$(find ".native-deps/$abi/lib" -maxdepth 1 -name '*.a' | wc -l)
            echo "✅ $abi: $count static libraries"
            test "$count" -ge 7
          done
          test ! -d app/src/main/cpp/prebuilt

      # ══════════════════════════════════════════════════════════════════════
      # Phase 3: Build Gradle APK (CMake links source-built dependencies)
      # ══════════════════════════════════════════════════════════════════════

      - name: "🔐 Chuẩn bị keystore ký release (nếu có secret)"
        id: signing
        run: |
          # v50: decode keystore từ GitHub Secrets để bản release có chữ ký
          # ỔN ĐỊNH giữa các lần build → cài đè không phải gỡ app. Thiếu
          # secret → bỏ qua, gradle tự fallback về debug keystore.
          if [ -n "${{ secrets.RELEASE_KEYSTORE_B64 }}" ]; then
            echo "${{ secrets.RELEASE_KEYSTORE_B64 }}" | base64 -d > /tmp/release-upload.keystore
            if keytool -list -keystore /tmp/release-upload.keystore \
                 -storepass "${{ secrets.RELEASE_KEYSTORE_STORE_PASSWORD }}" >/dev/null 2>&1; then
              echo "file=/tmp/release-upload.keystore" >> "$GITHUB_OUTPUT"
              echo "✅ Release keystore hợp lệ"
            else
              echo "⚠️ Keystore/Password không hợp lệ — fallback debug signing"
            fi
          else
            echo "⚠️ Chưa cấu hình RELEASE_KEYSTORE_* secrets — fallback debug signing"
          fi

      - name: "🏗️  Build APK (debug + release)"
        env:
          RELEASE_KEYSTORE_FILE: ${{ steps.signing.outputs.file }}
          RELEASE_KEYSTORE_STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_STORE_PASSWORD }}
          RELEASE_KEYSTORE_ALIAS: ${{ secrets.RELEASE_KEYSTORE_ALIAS }}
          RELEASE_KEYSTORE_KEY_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_KEY_PASSWORD }}
        run: |
          echo "🚀 Building APKs from upstream source-built libraries..."
          # v50: build thêm bản RELEASE (R8 minify) — Compose release nhanh hơn
          # rõ rệt so với debug và APK nhỏ hơn nhiều. Bản debug vẫn được build
          # làm fallback (nếu R8/R8-keep-rule có vấn đề gì đó).
          gradle :app:assembleDebug :app:assembleRelease --stacktrace

      # ══════════════════════════════════════════════════════════════════════
      # Phase 4: Verify APK
      # ══════════════════════════════════════════════════════════════════════

      - name: "📋 Verify APK contents"
        run: |
          set -e
          for VARIANT in debug release; do
            APK=$(find "app/build/outputs/apk/$VARIANT" -name "*.apk" | head -1)

            if [ ! -f "$APK" ]; then
              echo "❌ $VARIANT APK not found!"
              exit 1
            fi

            echo "=== $VARIANT APK Information ==="
            echo "📦 File: $(basename "$APK")"
            echo "💾 Size: $(du -h "$APK" | cut -f1)"
            echo "🔐 SHA256: $(sha256sum "$APK" | cut -d' ' -f1)"

            echo ""
            if unzip -l "$APK" | grep -q "lib/arm64-v8a/libsideloadnative.so"; then
              echo "✅ [$VARIANT] libsideloadnative.so linked successfully"
            else
              echo "❌ [$VARIANT] libsideloadnative.so NOT found!"
              exit 1
            fi
          done

          echo ""
          echo "=== Native Libraries in release APK ==="
          unzip -l app/build/outputs/apk/release/*.apk | grep "\.so$" | awk '{print $NF}'

      # ══════════════════════════════════════════════════════════════════════
      # Phase 5: Upload final APKs
      # ══════════════════════════════════════════════════════════════════════

      - name: "⬆️  Upload APK (release — khuyến nghị)"
        uses: actions/upload-artifact@v4
        with:
          name: superalpha-sideload-release
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30
          if-no-files-found: error

      - name: "⬆️  Upload APK (debug — dự phòng)"
        uses: actions/upload-artifact@v4
        with:
          name: superalpha-sideload-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: "✅ Build completed"
        run: |
          echo ""
          echo "╔════════════════════════════════════════════════════╗"
          echo "║       ✅ BUILD COMPLETED SUCCESSFULLY ✅           ║"
          echo "╚════════════════════════════════════════════════════╝"
          echo ""
          echo "📦 APK ready:"
          echo "   release: $(du -h app/build/outputs/apk/release/app-release.apk | cut -f1) (khuyến nghị — mượt hơn)"
          echo "   debug:   $(du -h app/build/outputs/apk/debug/app-debug.apk | cut -f1) (dự phòng)"
          echo ""
          echo "🚀 Install on Android:"
          echo "   adb install app-release.apk"
